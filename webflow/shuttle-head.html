<meta name="robots" content="noindex,nofollow">
<script>
(function(){var h=document.documentElement,t=null,m=null;try{t=localStorage.getItem('sphynx-shuttle:theme');m=localStorage.getItem('sphynx-shuttle:admin')}catch(e){}
if(m==='1')h.setAttribute('data-admin','ok');
var d=t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);h.setAttribute('data-theme',d?'dark':'light');
if(d){var mo=new MutationObserver(function(){var s=document.querySelectorAll('.shuttle:not(.is-dark)');for(var i=0;i<s.length;i++)s[i].classList.add('is-dark')});mo.observe(h,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',function(){mo.disconnect()})}})();
</script>
<style>
html,body{margin:0;background:#fff}
html[data-theme="dark"],html[data-theme="dark"] body{background:#000;color-scheme:dark}
html:not([data-admin="ok"]) [data-admin-only]{display:none!important}
[data-doc-template]{display:none!important}
.shuttle{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

.theme-toggle .tt-sun{display:none}
.theme-toggle[aria-checked="true"] .tt-sun{display:block}
.theme-toggle[aria-checked="true"] .tt-moon{display:none}
.theme-toggle[aria-checked="true"] .tt-knob{left:24px}
.theme-toggle:focus-visible,.cw-toggle:focus-visible,.icon-btn:focus-visible,.btn-primary:focus-visible,.btn-ghost:focus-visible,.row:focus-visible,.back:focus-visible,.gate-admin:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.gate-card{animation:sh-rise .6s cubic-bezier(.2,.7,.2,1) both}
.gate-input::placeholder{letter-spacing:0;font-size:15px}
.cw-list .cw-item:first-of-type{border-top:0}
.cw-panel.is-open{display:flex;animation:sh-pop .28s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom right}
.toast.is-on{display:flex;animation:sh-toast .25s cubic-bezier(.2,.7,.2,1) both}
.cw-error.is-on{display:block}
.cw-input.is-invalid,.cw-textarea.is-invalid{border-color:var(--_sphynx---err)}

</style>
