<meta name="robots" content="noindex,nofollow">
<script>
(function(){var h=document.documentElement,t=null,a=null;try{t=localStorage.getItem('sphynx-shuttle:theme');a=localStorage.getItem('sphynx-shuttle:auth')}catch(e){}
if(a==='1')h.setAttribute('data-auth','ok');
var d=t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);h.setAttribute('data-theme',d?'dark':'light');
if(d){var mo=new MutationObserver(function(){var s=document.querySelectorAll('.shuttle:not(.is-dark)');for(var i=0;i<s.length;i++)s[i].classList.add('is-dark')});mo.observe(h,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',function(){mo.disconnect()})}})();
</script>
